[project]
name = "spending-insights"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk[gcp,otel-gcp,mcp]==2.14.0",
    "google-genai==2.34.0",
    "google-auth==2.62.1",
    "google-cloud-aiplatform[agent-engines]==2.7.0",
    "google-cloud-agentplatform[agent-engines]==2.7.0",
    "opentelemetry-instrumentation-google-genai==0.7b1",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "a2a-sdk[http-server]>=1.0,<2",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "protobuf>=6.31.1,<7.0.0",
    "matplotlib==3.10.7",
    "pandas==2.3.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["spending_agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = "."

[tool.hatch.build.targets.wheel]
packages = ["spending_agent"]
